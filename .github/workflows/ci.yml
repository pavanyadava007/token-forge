name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens && npm run tokens:check
      - run: npm run lint && npm run typecheck
      - run: npm test
      - run: npm run build && npm run build-storybook
      - name: Browser tests (axe WCAG 2.2 AA, behaviour, visual snapshots)
        run: npx playwright test
        env: { CI: '1', HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run tokens
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.11 agent/.venv && uv pip install -p agent/.venv/bin/python -e "agent[dev]"
      - run: cd agent && .venv/bin/ruff check . && .venv/bin/ruff format --check . && .venv/bin/python -m pytest -q
      # The deterministic baselines need no model; recompute them and compare with the committed results.
      - run: cd agent && .venv/bin/python -m tokenforge_agent.corpus && git diff --exit-code corpus/
