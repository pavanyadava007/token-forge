name: Token release plan
# On every PR that touches tokens: build base and head, diff them, post the release plan
# (semver bump + change list) as a PR comment, and fail if a token was removed without deprecation.
on:
  pull_request:
    paths: ['tokens/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build head tokens
        run: npm run tokens && npm run tokens:check && cp -r dist/json /tmp/head
      - name: Build base tokens
        run: |
          git checkout -q ${{ github.event.pull_request.base.sha }} -- tokens
          npm run tokens && cp -r dist/json /tmp/base
          git checkout -q HEAD -- tokens
      - name: Diff
        id: diff
        run: node scripts/token-diff.mjs /tmp/base /tmp/head plan.md
        continue-on-error: true
      - name: Comment release plan
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('plan.md', 'utf8');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - if: steps.diff.outcome == 'failure'
        run: echo "Token policy violation, see the release plan comment" && exit 1
